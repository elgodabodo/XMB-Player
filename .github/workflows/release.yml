name: Build and Release Cross-Platform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux AppImage
            builder_flag: --linux appimage
          - os: windows-latest
            target: Windows Portable (.exe)
            builder_flag: --win portable

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite web app
        run: npm run build -- --base=./

      - name: Generate Electron wrapper
        run: |
          npm install -D electron electron-builder --legacy-peer-deps

          # 1. Create Preload Script (The Security Bridge)
          cat << 'EOF' > preload.cjs
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('api', {
            runCommand: (command) => ipcRenderer.invoke('run-command', command),
            openFile: (filePath) => ipcRenderer.invoke('open-file', filePath),
            platform: process.platform
          });
          EOF

          # 2. Create Main Process
          cat << 'EOF' > main.cjs
          const { app, BrowserWindow, ipcMain, shell } = require('electron');
          const { exec } = require('child_process');
          const path = require('path');

          // Redirect app data and configs to a local 'data' folder alongside the .exe
          if (process.env.PORTABLE_EXECUTABLE_DIR) {
            app.setPath('userData', path.join(process.env.PORTABLE_EXECUTABLE_DIR, 'data'));
          }

          function createWindow() {
            const win = new BrowserWindow({
              title: "XMB Player",
              width: 1280,
              height: 720,
              autoHideMenuBar: true,
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.on('page-title-updated', (e) => e.preventDefault());
            win.loadFile(path.join(__dirname, 'dist/index.html'));
          }

          ipcMain.handle('run-command', async (event, command) => {
            return new Promise((resolve, reject) => {
              exec(command, (error, stdout, stderr) => {
                if (error) {
                  console.error(`Exec error: ${error}`);
                  resolve({ success: false, error: stderr || error.message });
                } else {
                  resolve({ success: true, stdout });
                }
              });
            });
          });

          ipcMain.handle('open-file', async (event, filePath) => {
            const result = await shell.openPath(filePath);
            return { success: !result, error: result };
          });

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Package Desktop App
        run: |
          npx electron-builder ${{ matrix.builder_flag }} --publish never \
            -c.directories.output=release-out \
            -c.extraMetadata.main=main.cjs \
            -c.extraMetadata.name="xmbplayer" \
            -c.files="dist/**/*" \
            -c.files="main.cjs" \
            -c.files="preload.cjs"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release-out/*.*
          generate_release_notes: true
