name: Build and Release Linux AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'v1.0.0'

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite web app
        run: npm run build -- --base=./

      - name: Generate Electron wrapper
        run: |
          npm install -D electron electron-builder --legacy-peer-deps
          cat << 'EOF' > main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 720,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });
            win.loadFile(path.join(__dirname, 'dist/index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Package AppImage
        run: |
          npx electron-builder --linux appimage --publish never \
            -c.directories.output=release-out \
            -c.extraMetadata.main=main.cjs \
            -c.extraMetadata.name="xmbplayer" \
            -c.files="dist/**/*" \
            -c.files="main.cjs"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release-out/*.AppImage
          generate_release_notes: true
